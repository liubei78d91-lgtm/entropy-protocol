<!doctype html>
<!-- 逆熵协议 v2.1.0 · 单文件网页版 · 双击就能玩，不需要联网 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="application-name" content="逆熵协议">
<meta name="description" content="逆熵协议：三十日交易所 —— 单机文字策略游戏">
<title>逆熵协议 · 三十日交易所</title>

<style>
/* 逆熵协议 · style.css */
:root{
  --bg:#0b0f14;
  --panel:#131a23;
  --panel-2:#0e141b;
  --line:#22303f;
  --line-soft:#1a2531;
  --text:#cfd8e3;
  --text-hi:#eef4fa;
  --dim:#7d8fa3;
  --accent:#e8b339;
  --accent-soft:#3a2f13;
  --cool:#58a6ff;
  --good:#46b17b;
  --bad:#e5534b;
  --event:#d29922;
  --radius:12px;
  --tap:46px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 500px at 15% -10%, rgba(232,179,57,.07), transparent 60%),
    radial-gradient(700px 420px at 100% 10%, rgba(88,166,255,.05), transparent 55%);
}
.hidden{display:none !important;}
#screen-game{overflow-y:auto;overscroll-behavior:contain;}
#screen-game > *{flex-shrink:0;}
.num{font-variant-numeric:tabular-nums;}

/* ---------- 屏幕骨架 ---------- */
.screen{
  position:relative;z-index:1;
  height:100dvh;height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 10px);
  max-width:560px;margin:0 auto;width:100%;
}
.scroll-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:14px;}

/* ---------- 标题页 ---------- */
.title-wrap{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  text-align:center;gap:6px;padding-bottom:12px;
}
.logo-mark{
  font-size:34px;color:var(--accent);opacity:.85;line-height:1;
  letter-spacing:2px;margin-bottom:2px;
}
.game-title{
  font-size:34px;letter-spacing:8px;margin:0;color:var(--text-hi);font-weight:600;
  text-indent:8px;
}
.game-sub{
  margin:0;color:var(--accent);letter-spacing:5px;font-size:13px;text-indent:5px;
}
.tagline{
  color:var(--dim);font-size:13px;margin:16px 24px 0;min-height:2.4em;
}
.title-buttons{
  display:flex;flex-direction:column;gap:10px;margin:26px 18px 0;
}
.foot-note{
  color:#55657a;font-size:11px;text-align:center;margin:18px 0 0;letter-spacing:.5px;
}
.foot-note.warn{color:#d29922;margin-top:8px;}
.persist-hint{font-size:11px;color:#d29922;text-align:center;margin:0 0 6px;line-height:1.4;}

/* ---------- 按钮 ---------- */
.btn{
  appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--text);
  min-height:var(--tap);padding:10px 16px;border-radius:var(--radius);
  font-size:15px;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .12s ease,border-color .12s ease,transform .06s ease;
  text-align:center;
}
.btn:active{transform:scale(.985);}
.btn:hover{background:#18212c;}
.btn-primary{
  background:linear-gradient(180deg,#f2c04a,#d99f1c);border-color:#f0c455;
  color:#1a1206;font-weight:700;letter-spacing:1px;
}
.btn-primary:hover{background:linear-gradient(180deg,#ffd066,#e6ad2b);}
.btn-ghost{background:transparent;border-color:var(--line-soft);color:var(--dim);}
.btn-ghost:hover{color:var(--text);border-color:var(--line);}
.btn.wide{width:100%;}
.btn.danger{color:#f08a84;border-color:#4a2523;margin-top:26px;}
.btn:disabled{opacity:.38;cursor:not-allowed;}
.icon-btn{
  appearance:none;background:transparent;border:1px solid var(--line-soft);color:var(--dim);
  width:40px;height:40px;border-radius:10px;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.icon-btn:hover{color:var(--text);border-color:var(--line);}

/* ---------- 顶栏 ---------- */
.topbar{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;
}
.topbar-title{flex:1;font-size:15px;letter-spacing:3px;color:var(--text-hi);}
.topbar-right{width:40px;}
.lead{color:var(--dim);font-size:13px;margin:0 0 18px;}
.section-h{
  font-size:13px;letter-spacing:2px;color:var(--accent);margin:26px 0 10px;
  border-left:3px solid var(--accent);padding-left:8px;font-weight:600;
}
.rules-body h3,.rules-actions h3{margin:0;}

/* ---------- 规则页 ---------- */
.rule-block{margin-bottom:20px;}
.rule-block h3{
  font-size:14px;color:var(--text-hi);margin:0 0 6px;letter-spacing:1px;font-weight:600;
}
.rule-block p{margin:0 0 6px;font-size:13.5px;color:var(--dim);}
.rule-block p strong{color:var(--text);font-weight:600;}
.rules-actions{display:flex;flex-direction:column;gap:6px;}
.rule-line{
  display:flex;gap:10px;align-items:baseline;
  padding:8px 10px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:9px;
}
.rule-line .rn{color:var(--text-hi);font-size:13.5px;min-width:76px;}
.rule-line .rd{color:var(--dim);font-size:12.5px;flex:1;}
.rule-line .rc{color:var(--accent);font-size:11px;white-space:nowrap;}
.rules-foot{margin:26px 0 6px;display:flex;flex-direction:column;gap:10px;}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.hud-day{display:flex;align-items:baseline;gap:5px;}
.hud-day-num{font-size:30px;font-weight:700;color:var(--text-hi);line-height:1;font-variant-numeric:tabular-nums;}
.hud-day-of{color:var(--dim);font-size:12px;}
.hud-ap{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:8px;}
.ap-label{color:var(--dim);font-size:11px;letter-spacing:1px;}
.ap-pips{display:flex;gap:4px;}
.ap-pip{width:9px;height:9px;border-radius:50%;background:var(--line);}
.ap-pip.on{background:var(--accent);box-shadow:0 0 8px rgba(232,179,57,.55);}
.ap-num{color:var(--accent);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;min-width:18px;}

/* ---------- 资源 ---------- */
.stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px;
}
.stat{
  background:var(--panel-2);border:1px solid var(--line-soft);border-radius:9px;
  padding:6px 7px;
}
.stat .k{font-size:10px;color:var(--dim);letter-spacing:.5px;}
.stat .v{font-size:15px;font-weight:700;color:var(--text-hi);font-variant-numeric:tabular-nums;}
.stat.warn .v{color:var(--bad);}
.stat.good .v{color:var(--good);}
.stat.ent .v{color:var(--event);}
.stat small{font-size:9px;color:var(--dim);font-weight:400;}

/* ---------- 碎片 ---------- */
.frags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;min-height:24px;}
.frag{
  font-size:11px;padding:3px 8px;border-radius:20px;cursor:pointer;
  background:rgba(88,166,255,.10);border:1px solid rgba(88,166,255,.35);color:#9fc7f5;
  white-space:nowrap;
}
.frag:hover{background:rgba(88,166,255,.18);}
.frag.badge{background:rgba(232,179,57,.14);border-color:rgba(232,179,57,.5);color:#f0c455;}
.frag-empty{color:#4d5d70;font-size:11px;}

/* ---------- 日志 ---------- */
.log{
  flex:0 0 auto;height:clamp(120px,24vh,200px);overflow-y:auto;
  background:var(--panel-2);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:10px 12px;font-size:12.5px;line-height:1.72;margin-bottom:10px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.log::-webkit-scrollbar{display:none;width:0;height:0;}
.log div{margin-bottom:1px;word-break:break-word;}
.log .good{color:var(--good);}
.log .bad{color:var(--bad);}
.log .info{color:var(--cool);}
.log .event{color:var(--event);font-weight:600;}
.log .sys{color:var(--dim);}
.log .story{color:#c8b389;font-style:italic;}

/* ---------- 行动 ---------- */
.actions-wrap{margin-bottom:8px;}
.actions-h{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:11px;letter-spacing:2px;color:var(--dim);margin-bottom:7px;
}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.action{
  appearance:none;text-align:left;cursor:pointer;font-family:inherit;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:8px 9px;color:var(--text);min-height:56px;
  display:flex;flex-direction:column;gap:2px;justify-content:center;
  transition:background .12s,border-color .12s,transform .06s;
}
.action:hover:not(:disabled){background:#18212c;border-color:#2f4154;}
.action:active:not(:disabled){transform:scale(.985);}
.action:disabled{opacity:.34;cursor:not-allowed;}
.action .an{font-size:13px;font-weight:700;color:var(--text-hi);display:flex;justify-content:space-between;gap:6px;}
.action .an .cost{font-size:10px;color:var(--accent);font-weight:600;}
.action .ad{font-size:10.5px;color:var(--dim);line-height:1.4;}
.action .ar{font-size:10px;color:var(--bad);}
.action.special{background:var(--accent-soft);border-color:#5a4a1c;}

/* ---------- 底部 ---------- */
.footer-bar{
  position:sticky;bottom:calc(-1 * (env(safe-area-inset-bottom) + 10px));z-index:5;
  padding:22px 0 calc(env(safe-area-inset-bottom) + 2px);
  background:linear-gradient(180deg,rgba(11,15,20,0) 0,#0b0f14 62%);
  margin-top:auto;
}
.muted{color:#55657a;}

/* ---------- 弹层 ---------- */
.modal-root{
  position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:rgba(4,7,11,.72);backdrop-filter:blur(3px);
  padding:16px;
}
.modal{
  width:100%;max-width:520px;max-height:86dvh;overflow-y:auto;
  background:linear-gradient(180deg,#141c26,#0f151d);
  border:1px solid #2a3a4d;border-radius:16px;
  padding:20px 18px;box-shadow:0 24px 60px rgba(0,0,0,.55);
  animation:pop .16s ease-out;
}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985);}to{opacity:1;transform:none;}}
.modal-kicker{font-size:10px;letter-spacing:3px;color:var(--accent);margin-bottom:8px;}
.modal h2{
  margin:0 0 12px;font-size:19px;color:var(--text-hi);letter-spacing:1px;font-weight:600;
}
.modal p{font-size:13.5px;color:#b9c6d5;margin:0 0 10px;line-height:1.78;}
.modal p.q{color:#d8c79a;border-left:2px solid rgba(232,179,57,.4);padding-left:10px;font-style:italic;}
.modal .choices{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
.choice{
  appearance:none;font-family:inherit;text-align:left;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;color:var(--text);font-size:14px;min-height:48px;
  display:flex;flex-direction:column;gap:3px;
}
.choice:hover:not(:disabled){background:#1a2431;border-color:var(--accent);}
.choice:disabled{opacity:.4;}
.choice .req{font-size:11px;color:var(--bad);}
.modal .row{display:flex;gap:8px;margin-top:14px;}
.modal .row .btn{flex:1;}
.modal .amount-box{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px;}
.chip{
  appearance:none;font-family:inherit;cursor:pointer;font-size:12px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--text);
  border-radius:20px;padding:6px 12px;min-height:36px;
}
.chip:hover{border-color:var(--accent);color:var(--accent);}
.amount-input{
  width:100%;font-family:inherit;font-size:22px;font-variant-numeric:tabular-nums;
  background:#0a1017;border:1px solid var(--line);border-radius:10px;
  color:var(--accent);padding:12px 14px;text-align:center;outline:none;
}
.amount-input:focus{border-color:var(--accent);}
.modal .hint{font-size:11.5px;color:var(--dim);text-align:center;margin-top:6px;}

/* ---------- 结局 ---------- */
.ending-wrap{
  flex:1;display:flex;flex-direction:column;justify-content:flex-start;overflow-y:auto;
  text-align:center;padding:22px 4px;
}
.ending-kicker{font-size:10px;letter-spacing:4px;color:var(--dim);}
.ending-title{
  font-size:30px;letter-spacing:6px;margin:10px 0 18px;color:var(--accent);
  font-weight:600;text-indent:6px;
}
.ending-text{text-align:left;font-size:13.5px;color:#b9c6d5;line-height:1.9;}
.ending-text p{margin:0 0 12px;}
.ending-stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:22px 0 18px;
}
.ending-stats .stat{background:rgba(255,255,255,.02);}
.ending-buttons{display:flex;flex-direction:column;gap:9px;}

/* ---------- 横屏/大屏 ---------- */
@media (min-width:720px){
  .screen{max-width:720px;padding-left:24px;padding-right:24px;}
  .stats{grid-template-columns:repeat(6,1fr);}
  .actions{grid-template-columns:repeat(3,1fr);}
  .game-title{font-size:44px;}
  .log{max-height:36vh;}
}
@media (max-height:640px){
  .game-title{font-size:28px;}
  .title-buttons{margin-top:14px;}
  .log{height:96px;}
  .action{min-height:50px;padding:6px 8px;}
  .game-title{letter-spacing:5px;}
}


/* ---------- v1.2 新增 ---------- */
/* 每日小报 */
.newsbar{
  display:flex;align-items:flex-start;gap:7px;margin:6px 0 4px;padding:6px 9px;border-radius:8px;
  background:rgba(210,153,34,.08);border:1px solid rgba(210,153,34,.26);
  color:#d9c08a;font-size:11.5px;line-height:1.5;
}
.nb-tag{
  flex:0 0 auto;font-size:10px;letter-spacing:1px;color:var(--event);
  border:1px solid rgba(210,153,34,.45);border-radius:4px;padding:0 4px;margin-top:1px;
}
.nb-text{
  flex:1 1 auto;min-width:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.nb-mul{flex:0 0 auto;font-size:11px;color:#b99b52;white-space:nowrap;margin-top:1px;}
/* 被典当掉的日志 */
.log .lost{color:#4a5a6b;font-style:italic;letter-spacing:1px;}
.log .news{color:#b99b52;}
/* 结局图鉴 */
.g-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.g-card{
  background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;
  padding:9px 10px;min-height:84px;opacity:.7;
}
.g-card.got{opacity:1;border-color:rgba(232,179,57,.35);background:rgba(232,179,57,.05);}
.g-title{font-size:13px;font-weight:700;color:var(--text-hi);margin-bottom:4px;letter-spacing:1px;}
.g-card:not(.got) .g-title{color:#54657a;}
.g-body{font-size:11.5px;color:var(--dim);line-height:1.55;}
.g-card.got .g-body{color:#c8b389;}
.g-ach{margin-top:4px;}
.g-count{font-size:12px;color:var(--dim);margin:0 0 6px;}
.g-line{display:flex;flex-direction:column;padding:7px 2px;border-bottom:1px solid var(--line-soft);opacity:.5;}
.g-line.got{opacity:1;}
.g-line .gn{font-size:13px;color:var(--text-hi);}
.g-line.got .gn{color:var(--accent);}
.g-line .gd{font-size:11.5px;color:var(--dim);}
/* 开局身份 */
.choice.origin{padding:13px 14px;}
.choice .perk{font-size:11px;color:var(--accent);margin-top:5px;letter-spacing:.5px;}
/* 人生报告 */
.life-report{margin:2px 0 12px;text-align:left;}
.life-report .section-h{margin:0 0 8px;}
.rep-line{display:flex;justify-content:space-between;gap:10px;padding:5px 2px;border-bottom:1px solid var(--line-soft);font-size:13px;}
.rep-line .rk{color:var(--dim);flex:0 0 auto;}
.rep-line .rv{color:var(--text-hi);text-align:right;word-break:break-word;}
/* 提示条 */
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 26px);
  transform:translateX(-50%);z-index:60;
  background:rgba(19,26,35,.96);border:1px solid rgba(232,179,57,.45);
  color:var(--accent);font-size:13px;padding:9px 16px;border-radius:999px;
  box-shadow:0 8px 26px rgba(0,0,0,.5);max-width:88vw;text-align:center;
}

/* 存档槽 */
.slots{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.slot-row{
  display:flex;align-items:center;gap:10px;
  background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px 11px;
}
.slot-info{flex:1;min-width:0;}
.slot-name{font-size:13px;color:var(--text-hi);font-weight:600;letter-spacing:1px;}
.slot-desc{font-size:11.5px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.slot-acts{display:flex;gap:6px;flex:0 0 auto;}
.slot-btn{
  appearance:none;font-family:inherit;cursor:pointer;font-size:12px;
  padding:6px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);
  color:var(--text);min-height:32px;
}
.slot-btn:hover{border-color:var(--accent);color:var(--text-hi);}
.slot-btn.primary{background:var(--accent-soft);border-color:rgba(232,179,57,.45);color:var(--accent);}
.slot-btn.danger{color:#f08a84;border-color:#4a2523;}


/* ---------- v2.0 新增 ---------- */
.log .w3{color:#8fa6c0;}
.membar{
  appearance:none;font-family:inherit;cursor:pointer;text-align:left;
  width:100%;background:transparent;border:0;color:var(--cool);
  font-size:11.5px;letter-spacing:.5px;padding:0 0 8px;
}
.membar:hover{color:var(--text-hi);}
.contract{
  margin:0 0 8px;padding:6px 9px;border-radius:8px;
  background:rgba(88,166,255,.07);border:1px solid rgba(88,166,255,.22);
  color:#a9c8e8;font-size:11.5px;line-height:1.5;
}
.choice .memt{font-size:13px;line-height:1.5;}
.memlist{display:flex;flex-direction:column;gap:7px;margin-top:12px;max-height:52dvh;overflow-y:auto;}
.memrow{
  background:var(--panel-2);border:1px solid var(--line-soft);border-radius:9px;
  padding:8px 10px;font-size:12.5px;color:#c8b389;line-height:1.55;
}
.codex-item{
  border-left:2px solid var(--line-soft);padding:8px 0 8px 12px;margin-bottom:10px;opacity:.55;
}
.codex-item.got{opacity:1;border-left-color:var(--accent);}
.codex-t{font-size:13px;color:var(--text-hi);font-weight:600;letter-spacing:1px;margin-bottom:4px;}
.codex-item:not(.got) .codex-t{color:#54657a;}
.codex-b{font-size:12.5px;color:var(--dim);line-height:1.7;}
.codex-item.got .codex-b{color:#b9c6d5;}
.codex-b p{margin:0 0 4px;}
.frag-story{font-size:12px;color:#a08a5f;font-style:italic;}
.epi{
  font-size:12.5px;color:#c8b389;font-style:italic;text-align:center;
  margin:10px 0;line-height:1.8;
}

</style>
</head>
<body>

<!-- ============ 标题页 ============ -->
<section id="screen-title" class="screen">
  <div class="title-wrap">
    <div class="logo-mark">§</div>
    <h1 class="game-title">逆熵协议</h1>
    <p class="game-sub">三十日交易所</p>
    <p class="tagline" id="tagline"></p>

    <div class="title-buttons">
      <button class="btn btn-primary" id="btn-new">签下契约</button>
      <button class="btn" id="btn-continue">读取存档</button>
      <button class="btn btn-ghost" id="btn-gallery">结局图鉴</button>
      <button class="btn btn-ghost" id="btn-codex">档案室</button>
      <button class="btn btn-ghost" id="btn-rules">协议条款</button>
      <button class="btn btn-ghost" id="btn-about">关于</button>
    </div>

    <p class="foot-note">
