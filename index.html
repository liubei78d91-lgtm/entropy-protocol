<script>
/* =========================================================
   逆熵协议 · 引擎 engine.js
   —— 纯规则，不碰 DOM，方便单独测试与替换
   依赖：content.js 定义的全局 CONTENT
   ========================================================= */
(function (root) {
  "use strict";

  var C = root.CONTENT;
  var CFG = C.config;
  var SAVE_KEY = "entropy_protocol_save_v1";   // 老版本单槽，仅用于迁移
  var SLOT_PREFIX = "entropy_protocol_slot_v2_";
  var SLOT_COUNT = 3;
  var currentSlot = 1;
  function slotKey(n) { return SLOT_PREFIX + n; }
  var persistent = false;   // localStorage 是否可用（file:// 或隐私模式下可能不可用）
  var store = (function () {
    try {
      var t = "__t";
      localStorage.setItem(t, "1");
      localStorage.removeItem(t);
      persistent = true;
      return localStorage;
    } catch (e) {
      var mem = {};
      return {
        getItem: function (k) { return k in mem ? mem[k] : null; },
        setItem: function (k, v) { mem[k] = String(v); },
        removeItem: function (k) { delete mem[k]; }
      };
    }
  })();

  /* ---------- 跨存档记忆（图鉴 / 成就） ---------- */
  var META_KEY = "entropy_protocol_meta_v1";
  var META = { endings: {}, achievements: {}, codex: {}, runs: 0 };
  function loadMeta() {
    try {
      var raw = store.getItem(META_KEY);
      if (!raw) return;
      var m = JSON.parse(raw);
      if (m && typeof m === "object") {
        META.endings = m.endings || {};
        META.achievements = m.achievements || {};
        META.codex = m.codex || {};
        META.runs = m.runs || 0;
      }
    } catch (e) {}
  }
  function saveMeta() { try { store.setItem(META_KEY, JSON.stringify(META)); } catch (e) {} }
  function endingCount() {
    var n = 0;
    for (var k in META.endings) if (META.endings[k]) n++;
    return n;
  }
  loadMeta();

  var S = null;
  var subs = [];
  var choice = null;        // 需要玩家做选择（碎片三选一）
  var story = null;         // 当前剧情节点
  var storyQueue = [];      // 待播剧情

  /* ---------- 基础工具 ---------- */
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function d6() {
    var n = Math.floor(Math.random() * 6) + 1;
    if (has("ruleHack")) n = Math.min(6, n + 1);
    return n;
  }
  function has(id) { return S && S.fragments.indexOf(id) >= 0; }
  function log(msg, cls) {
    S.log.push({ m: msg, c: cls || "info" });
    if (S.log.length > 260) S.log.shift();
  }
  // 典当记忆时，日志里真的会少掉几行——你读过的东西也没了。
  var LOST_TEXT = "▓▓▓▓▓▓　这一段你想不起来了　▓▓▓▓▓▓";
  function eatLog(n) {
    if (!S || !S.log || !S.log.length) return 0;
    var pool = [];
    for (var i = 0; i < S.log.length; i++) {
      if (S.log[i].c !== "lost" && S.log[i].c !== "sys") pool.push(i);
    }
    if (!pool.length) return 0;
    var count = Math.min(pool.length, Math.max(1, Math.round(n)));
    for (var k = 0; k < count; k++) {
      var at = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
      S.log[at] = { m: LOST_TEXT, c: "lost" };
      S.lostCount = (S.lostCount || 0) + 1;
    }
    return count;
  }
  function emit(type) {
    for (var i = 0; i < subs.length; i++) {
      try { subs[i](type || "change"); } catch (e) { /* 忽略 UI 异常 */ }
    }
  }
  var saveErr = false;
  function save() {
    if (!S) return false;
    S.savedAt = Date.now();
    try { store.setItem(slotKey(currentSlot), JSON.stringify(S)); saveErr = false; return true; }
    catch (e) { saveErr = true; return false; }
  }
  function readSlot(n) {
    try {
      var raw = store.getItem(slotKey(n));
      if (!raw) return null;
      var d = JSON.parse(raw);
      if (!d || !d.version) return null;
      return d;
    } catch (e) { return null; }
  }
  function slotInfo(n) {
    var d = readSlot(n);
    if (!d) return { id: n, empty: true };
    var name = "", list = C.origins || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === d.origin) name = list[i].name;
    var et = "";
    if (d.endingId) for (var k = 0; k < C.endings.length; k++) if (C.endings[k].id === d.endingId) et = C.endings[k].title;
    return { id: n, empty: false, day: d.day, over: !!d.over,
             endingId: d.endingId || null, endingTitle: et,
             origin: d.origin || null, originName: name,
             net: d.net || 0, savedAt: d.savedAt || 0 };
  }
  function slots() {
    var out = [];
    for (var i = 1; i <= SLOT_COUNT; i++) out.push(slotInfo(i));
    return out;
  }
  function hasSave() {
    for (var i = 1; i <= SLOT_COUNT; i++) if (readSlot(i)) return true;
    return false;
  }
  function clearSave(slot) {
    if (slot) { try { store.removeItem(slotKey(slot)); } catch (e) {} return; }
    for (var i = 1; i <= SLOT_COUNT; i++) { try { store.removeItem(slotKey(i)); } catch (e) {} }
  }
  function discard() {
    S = null; choice = null; story = null; storyQueue = [];
    emit("discard");
  }
  // 老版本只有一个存档键，开机时搬进 1 号槽
  (function migrateLegacy() {
    try {
      var raw = store.getItem(SAVE_KEY);
      if (!raw) return;
      var occupied = false;
      for (var i = 1; i <= SLOT_COUNT; i++) if (store.getItem(slotKey(i))) occupied = true;
      if (!occupied) store.setItem(slotKey(1), raw);
      store.removeItem(SAVE_KEY);
    } catch (e) {}
  })();

  /* ---------- 数值 ---------- */
  function taxFor(day) {
    var base = CFG.taxBase + CFG.taxGrowth * day + Math.max(0, S.cash) * CFG.taxCashRate;
    return Math.round(base * ((S && S.taxMul) || 1));
  }
  function netWorth() {
    var v = CFG.valuation;
    return Math.round(S.cash + S.influence * v.influence + S.ep * v.ep +
      S.memory * v.memory + S.intel * v.intel - S.debt);
  }
  function apMax() {
    var ap = CFG.apBase;
    if (S.health < 50) ap -= 1;
    if (S.health < 25) ap -= 1;
    if (has("timeFold")) ap += 1;
    return Math.max(1, ap);
  }
  function fragmentDrain() {
    var n = S.fragments.filter(function (f) { return f !== "badge"; }).length;
    return Math.max(0, Math.ceil((n - CFG.freeFragments) / 2));
  }
  function gain(amount, opts) {
    opts = opts || {};
    var v = amount;
    if (!opts.raw && has("entropyAnchor")) v = Math.round(amount * (1 - CFG.anchorIncomePenalty));
    S.cash += v;
    if (S.today && v > 0) S.today.earn = (S.today.earn || 0) + v;
    return v;
  }
  function spend(amount) {
    var before = S.cash;
    S.cash -= amount;
    if (S.cash < 0) S.cash = 0;
    if (S.today) S.today.spend = (S.today.spend || 0) + Math.max(0, before - S.cash);
  }
  function addHealth(n) { S.health = clamp(S.health + n, 0, CFG.maxHealth); }

  /* ---------- 记忆库 ---------- */
  function memText(id) {
    var pool = C.memoryPool || [];
    for (var i = 0; i < pool.length; i++) if (pool[i].id === id) return pool[i].t;
    return "一段想不起来内容的记忆";
  }
  function pickMemories(n) {
    var pool = (C.memoryPool || []).slice(), out = [];
    while (out.length < n && pool.length) out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0].id);
    return out;
  }
  function syncMemories(logDrop) {
    if (!S || !C.memoryPool) return;
    if (!S.memories) S.memories = [];
    if (!S.memSold) S.memSold = [];
    var want = Math.min(10, Math.ceil(Math.max(0, S.memory) / 10));
    var list = S.memories.slice(), dropped = [];
    while (list.length > want) {
      var at = Math.floor(Math.random() * list.length);
      dropped.push(list[at]);
      list.splice(at, 1);
    }
    while (list.length < want) {
      var pool = (C.memoryPool || []).filter(function (m) {
        return list.indexOf(m.id) < 0 && S.memSold.indexOf(m.id) < 0;
      });
      if (!pool.length) break;
      list.push(pool[Math.floor(Math.random() * pool.length)].id);
    }
    S.memories = list;
    for (var d = 0; d < dropped.length; d++) {
      if (S.memSold.indexOf(dropped[d]) < 0) S.memSold.push(dropped[d]);
    }
    if (logDrop) for (var i = 0; i < dropped.length; i++) log("你弄丢了一段记忆：" + memText(dropped[i]), "lost");
  }
  function addMemory(n) {
    var before = S.memory;
    S.memory = clamp(S.memory + n, 0, CFG.maxMemory);
    if (S.memory !== before) syncMemories(S.memory < before);
  }
  function addEntropy(n) { S.entropy = Math.max(0, S.entropy + n); }

  /* ---------- 碎片 ---------- */
  function fragmentPool() {
    return Object.keys(C.fragments).filter(function (k) {
      return k !== "badge" && S.fragments.indexOf(k) < 0;
    });
  }
  function pickRandom(pool) {
    if (!pool.length) return null;
    return pool[Math.floor(Math.random() * pool.length)];
  }
  function threeOptions() {
    var pool = fragmentPool().slice();
    var out = [];
    while (out.length < 3 && pool.length) {
      out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    }
    return out;
  }
  // 徽章：只要手上还有 7 枚非徽章的碎片，就一定能拿回徽章。
  // 否则「规则被抹除」这类事件会把隐藏结局的钥匙悄悄弄丢。
  function syncBadge() {
    var n = 0;
    for (var i = 0; i < S.fragments.length; i++) if (S.fragments[i] !== "badge") n++;
    if (n >= CFG.badgeCount && S.fragments.indexOf("badge") < 0) {
      S.fragments.push("badge");
      log("七枚碎片彼此靠近，拼出一枚徽章。", "event");
    }
  }
  function grantFragment(id) {
    if (!id || S.fragments.indexOf(id) >= 0) return false;
    S.fragments.push(id);
    log("获得规则碎片：" + C.fragments[id].name, "good");
    if (C.fragments[id].story) log("　" + C.fragments[id].story, "story");
    syncBadge();
    checkResonance();
    return true;
  }
  function checkForget() {
    if (S.memory >= CFG.forgetMemoryBelow || !S.fragments.length) return;
    var p = CFG.forgetChance;
    if (has("memoryCash")) p *= 2;
    if (Math.random() < p) {
      var pending = S.fragments.filter(function (x) { return x !== "badge"; });
      if (!pending.length) return;
      var lost = pending[Math.floor(Math.random() * pending.length)];
      S.fragments.splice(S.fragments.indexOf(lost), 1);
      log("记忆崩塌，你忘掉了一条规则：" + C.fragments[lost].name, "bad");
      syncBadge();
    }
  }

  /* ---------- 行动表 ---------- */
  var ACTIONS = [
    {
      id: "work", name: "打工", cost: 1, tag: "收入",
      desc: "+" + CFG.workPay + " 现金 · -" + CFG.workHealth + " 健康 · +2 信用",
      can: function () { return S.health > CFG.workHealth ? null : "健康不够，你站不住了"; },
      run: function () {
        var pay = Math.round(CFG.workPay * (S.newsMul || 1));
        var v = gain(pay);
        addHealth(-CFG.workHealth);
        S.credit = clamp(S.credit + 2, 0, 100);
        log("打工：+" + v + " 现金，-" + CFG.workHealth + " 健康", "good");
      }
    },
    {
      id: "rest", name: "休息", cost: 1, tag: "恢复",
      desc: "+" + CFG.restHealth + " 健康",
      can: function () { return S.health >= CFG.maxHealth ? "健康已经满了" : null; },
      run: function () {
        var r = Math.round(CFG.restHealth * (S.restMul || 1));
        addHealth(r);
        log("休息：+" + r + " 健康", "good");
      }
    },
    {
      id: "social", name: "社交", cost: 1, tag: "影响力",
      desc: "-300 现金 · +5 影响力，掷出 4+ 再 +5",
      can: function () { return S.cash >= 300 ? null : "现金不足 300"; },
      run: function () {
        spend(300);
        var r = d6();
        var inf = 5 + (r >= 4 ? 5 : 0);
        S.influence += inf;
        log("社交：-300 现金，+" + inf + " 影响力（掷出 " + r + "）", "good");
      }
    },
    {
      id: "study", name: "学习情报", cost: 1, tag: "情报",
      desc: "-500 现金 · +1 情报",
      can: function () { return S.cash >= 500 ? null : "现金不足 500"; },
      run: function () { spend(500); S.intel += 1; log("学习：-500 现金，+1 情报（共 " + S.intel + "）", "info"); }
    },
    {
      id: "craft", name: "合成碎片", cost: 1, tag: "规则",
      desc: "3 情报 → 从 3 枚碎片中选 1 枚",
      can: function () { return S.intel >= 3 ? null : "情报不足 3 点"; },
      run: function () {
        S.intel -= 3;
        var opts = threeOptions();
        if (!opts.length) { gain(2000, { raw: true }); log("没有新规则可合成，返还 2000 现金", "info"); return; }
        choice = { kind: "fragment", source: "craft", options: opts, title: "合成：选择一条规则" };
      }
    },
    {
      id: "invLow", name: "低风险投资", cost: 1, tag: "投资", amount: true,
      desc: "投入 ≤ 全部现金，次日按 市场×1.03 返还",
      can: function () { return S.cash >= 100 ? null : "至少需要 100 现金"; },
      run: function (input) {
        var amt = Math.floor(input && input.amount || 0);
        if (!(amt >= 100)) { log("投资金额无效", "bad"); return "abort"; }
        if (amt > S.cash) amt = Math.floor(S.cash);
        spend(amt);
        S.pending.push({ amount: amt });
        log("低风险投资 " + amt + " 现金，次日结算", "info");
      }
    },
    {
      id: "invHigh", name: "高风险投资", cost: 1, tag: "投资", amount: true,
      desc: "投入 ≤ " + CFG.highCap + "：1-3 全损，4-5 返 1.8 倍，6 返 3.2 倍",
      can: function () { return S.cash >= 100 ? null : "至少需要 100 现金"; },
      run: function (input) {
        var amt = Math.floor(input && input.amount || 0);
        if (!(amt >= 100)) { log("投资金额无效", "bad"); return "abort"; }
        amt = Math.min(amt, Math.floor(S.cash), CFG.highCap);
        spend(amt);
        var r = d6(), ret = 0;
        if (r >= 6) ret = Math.round(amt * 3.2);
        else if (r >= 4) ret = Math.round(amt * 1.8);
        S.cash += ret;
        log("高风险投资掷出 " + r + "，收回 " + ret + " 现金", ret > amt ? "good" : "bad");
        if (ret === 0) S.stats.investLose++; else S.stats.investWin++;
      }
    },
    {
      id: "loan", name: "借贷", cost: 1, tag: "现金",
      desc: "+1000 现金 · 债务 +1050 · 信用 -5",
      can: function () { return null; },
      run: function () {
        gain(1000, { raw: true });
        var add = CFG.loanDebt;
        if (has("creditLever") && S.credit > 70) add = Math.round(CFG.loanDebt / 2);
        S.debt += add;
        S.credit = clamp(S.credit - 5, 0, 100);
        log("借贷：+1000 现金，债务 +" + add + "，信用 -5", "bad");
      }
    },
    {
      id: "pawn", name: "典当记忆", cost: 1, tag: "记忆", amount: true,
      desc: "卖掉一段具体记忆 · +800 现金 · 熵 +1",
      can: function () {
        if (S.memory < 10) return "记忆不足 10";
        if (!S.memories || !S.memories.length) return "已经没有能想起来的事";
        return null;
      },
      run: function (input) {
        var mid = (input && input.memoryId) || (S.memories && S.memories[0]) || null;
        var at = S.memories ? S.memories.indexOf(mid) : -1;
        if (at < 0) { log("你想不起来要当哪一段", "bad"); return "abort"; }
        var txt = memText(mid);
        S.memories.splice(at, 1);
        if (!S.memSold) S.memSold = [];
        if (S.memSold.indexOf(mid) < 0) S.memSold.push(mid);
        S.memory = Math.max(0, S.memory - 10);
        var pay = Math.round(800 * (S.pawnMul || 1));
        gain(pay, { raw: true });
        S.credit = clamp(S.credit - 2, 0, 100);
        S.stats.memPawned = (S.stats.memPawned || 0) + 10;
        addEntropy(1);
        eatLog(2);
        log("典当记忆：「" + txt + "」+" + pay + " 现金", "bad");
        syncMemories(false);
      }
    },
    {
      id: "black", name: "黑市交易", cost: 1, tag: "熵", choice: true,
      desc: "10 健康 → 1 逆熵点 或 500 现金 · 熵 +1",
      can: function () { return S.health > 10 ? null : "健康太低，没人敢跟你交易"; },
      run: function (input) {
        var takeCash = !!(input && input.blackCash);
        addHealth(-10);
        addEntropy(1);
        if (takeCash) { gain(500); log("黑市：-10 健康，+500 现金，熵 +1", "bad"); }
        else { S.ep += 1; log("黑市：-10 健康，+1 逆熵点，熵 +1", "bad"); }
      }
    },
    {
      id: "challenge", name: "挑战交易所", cost: 1, tag: "熵",
      desc: "熵 +1 · 掷 1d6 赌一把",
      can: function () { return null; },
      run: function () {
        addEntropy(1);
        var r = d6();
        if (r <= 2) {
          if (S.cash >= 1000) { spend(1000); log("挑战失败（掷出 " + r + "），损失 1000 现金", "bad"); }
          else { addHealth(-15); log("挑战失败（掷出 " + r + "），健康 -15", "bad"); }
        } else if (r <= 4) {
          var opts = threeOptions();
          if (opts.length) choice = { kind: "fragment", source: "challenge", options: opts, title: "交易所的赌注：挑一条规则" };
          else { gain(3000, { raw: true }); log("挑战成功，但规则已被抽空，+3000 现金", "good"); }
        } else {
          if (Math.random() < 0.5) { S.ep += 2; log("挑战成功（掷出 " + r + "），+2 逆熵点", "good"); }
          else { gain(3000, { raw: true }); log("挑战成功（掷出 " + r + "），+3000 现金", "good"); }
        }
      }
    },
    {
      id: "anchor", name: "购买熵减锚", cost: 1, tag: "熵",
      desc: "-500 现金 · 熵 -1",
      can: function () { return S.cash >= 500 ? null : "现金不足 500"; },
      run: function () { spend(500); addEntropy(-1); log("购买熵减锚：-500 现金，熵 -1", "good"); }
    },
    {
      id: "auction", name: "规则拍卖", cost: 0, tag: "规则",
      desc: "每 5 天开放 · 3000 现金或 1 逆熵点 → 三选一",
      can: function () {
        if (S.day % 5 !== 0) return "拍卖只在第 5、10、15、20、25、30 天开放";
        if (S.usedToday.auction) return "今天已经拍过了";
        if (S.ep < 1 && S.cash < 3000) return "需要 1 逆熵点或 3000 现金";
        return null;
      },
      run: function () {
        if (S.ep >= 1) S.ep -= 1; else spend(3000);
        S.usedToday.auction = true;
        var opts = threeOptions();
        if (!opts.length) { log("没有未被抽走的规则了，拍卖流拍（资源已退还）", "bad"); gain(3000, { raw: true }); return; }
        choice = { kind: "fragment", source: "auction", options: opts, title: "拍卖台：三选一" };
      }
    }
  ];

  var ACTION_MAP = {};
  ACTIONS.forEach(function (a) { ACTION_MAP[a.id] = a; });

  /* ---------- 剧情 ---------- */
  function pushStory(scene) {
    if (S.seen.indexOf(scene.id) >= 0) return false;
    storyQueue.push(scene);
    return true;
  }
  function checkStory() {
    for (var i = 0; i < C.scenes.length; i++) {
      var sc = C.scenes[i];
      if (S.seen.indexOf(sc.id) >= 0) continue;
      if (sc.day && S.day < sc.day) continue;
      if (sc.when && !sc.when(S, api)) continue;
      pushStory(sc);
      break;
    }
  }
  function nextStory() {
    if (!story) story = storyQueue.shift() || null;
    return story;
  }

  /* ---------- 结局 ---------- */
  function pickEnding() {
    for (var i = 0; i < C.endings.length; i++) {
      var e = C.endings[i];
      var ok = false;
      try { ok = !!e.when(S, api); } catch (err) { ok = false; }
      if (ok) return e;
    }
    return C.endings[C.endings.length - 1];
  }
  function finish(reason) {
    if (S.over) return;
    S.over = true;
    S.endReason = reason || "结算";
    S.net = netWorth();
    var e = pickEnding();
    S.endingId = e.id;
    S.lastMemory = (S.memories && S.memories.length) ? S.memories[0] : null;
    S.epilogue = [];
    var eps = e.epilogues || [];
    for (var ei = 0; ei < eps.length; ei++) {
      var hit = false;
      try { hit = !!eps[ei].when(S, api); } catch (err) { hit = false; }
      if (hit) S.epilogue.push(eps[ei].text);
    }
    checkCodex();
    if (S.stats) S.stats.peakNet = Math.max(S.stats.peakNet || 0, S.net);
    META.endings[e.id] = META.endings[e.id] || Date.now();
    META.runs = (META.runs || 0) + 1;
    saveMeta();
    log("════════════════════", "event");
    log("第 " + S.day + " 天，" + S.endReason + "。", "event");
    log("净资产：" + S.net + " 现金等值", "sys");
    log("结局：【" + e.title + "】", "event");
    for (var ek = 0; ek < (S.epilogue || []).length; ek++) log("　" + S.epilogue[ek], "story");
    log("════════════════════", "event");
    checkAchievements();
    save();
    emit("ending");
  }
  function checkDeath() {
    if (S.over) return true;
    if (S.health <= 0) { S.health = 0; finish("健康归零"); return true; }
    if (S.memory <= 0) { S.memory = 0; finish("记忆燃尽"); return true; }
    if (S.entropy >= CFG.entropyMax) { S.entropy = CFG.entropyMax; finish("熵值满溢"); return true; }
    return false;
  }

  /* ---------- 每日流程 ---------- */
  function startDay(n) {
    S.day = n;
    S.usedToday = {};
    S.crash = false;
    if (!S.stats) S.stats = { actions: 0, investWin: 0, investLose: 0 };
    S.stats.dayActs = 0;

    // 1. 熵税
    var tax = taxFor(n);
    S.lastTax = tax;
    if (S.cash >= tax) {
      spend(tax);
      log("第 " + n + " 天 · 缴纳熵税 " + tax + " 现金", "sys");
    } else {
      var paid = S.cash;
      spend(S.cash);
      var owe = tax - paid;
      if (has("healthPledge")) {
        var loss = Math.min(15, Math.ceil(owe / 50));
        addHealth(-loss);
        log("第 " + n + " 天 · 熵税差 " + owe + "，健康抵押生效：-" + loss + " 健康", "bad");
      } else {
        var hl = Math.min(15, Math.ceil(owe / 100));
        addHealth(-hl);
        addMemory(-hl);
        eatLog(1);
        log("第 " + n + " 天 · 熵税差 " + owe + "，交易所取走 " + hl + " 健康与 " + hl + " 记忆", "bad");
      }
    }

    // 2. 债务利息
    if (S.debt > 0) {
      var interest = Math.round(S.debt * CFG.debtRate);
      S.debt += interest;
      log("债务利息 +" + interest + "（当前债务 " + Math.round(S.debt) + "）", "bad");
    }

    // 3. 碎片侵蚀记忆
    var drain = fragmentDrain();
    if (drain > 0) {
      addMemory(-drain);
      log("身上 " + S.fragments.length + " 条规则在啃食记忆：-" + drain + " 记忆", "bad");
    }

    // 4. 时间折叠
    if (has("timeFold")) { addHealth(-CFG.timeFoldHealth); log("时间折叠：-" + CFG.timeFoldHealth + " 健康", "bad"); }

    // 5. 熵减锚
    if (has("entropyAnchor") && S.entropy > 0) {
      addEntropy(-1);
      log("熵减锚自行运转：熵 -1", "good");
    }

    // 6. 市场
    var r = Math.floor(Math.random() * 6) + 1;
    S.market = +(1 + (r - 3) * 0.05).toFixed(2);
    log("市场波动系数：" + S.market, "sys");

    // 6.5 今日小报（影响当日工价）
    if (C.headlines && C.headlines.length) {
      var hl = C.headlines[Math.floor(Math.random() * C.headlines.length)];
      S.news = hl.t;
      S.newsMul = hl.m;
      log("【晚报】" + hl.t, "news");
    }

    // 6.2 街角小事件
    if (C.events && C.events.length && Math.random() < 0.35) {
      var ev = C.events[Math.floor(Math.random() * C.events.length)];
      log("【街角】" + ev.t, "story");
      applyEffect(ev.eff || {});
    }

    // 6.3 窗口三号（每天一行）
    if (C.window3 && C.window3[n - 1]) log(C.window3[n - 1], "w3");

    // 6.4 今日委托
    S.contract = null;
    if (C.contracts && C.contracts.length && Math.random() < 0.6) {
      var ct = C.contracts[Math.floor(Math.random() * C.contracts.length)];
      S.contract = { id: ct.id, text: ct.text, hint: ct.hint, done: false, failed: false };
      log("【今日委托】" + ct.text + "（" + ct.hint + "）", "event");
    }

    // 7. 随机事件（每 3 天）
    if (n % 3 === 0) triggerEvent();

    // 8. 剧情
    checkStory();

    // 8.5 今日计数从此刻开始统计
    S.today = { actions: 0, work: 0, rest: 0, spend: 0, earn: 0, black: 0, challenge: 0, social: 0, study: 0 };

    // 9. AP
    S.ap = apMax();

    checkDeath();
    checkCodex();
    save();
    emit("day");
  }

  function triggerEvent() {
    var r = Math.floor(Math.random() * 6) + 1;
    log("—— 交易所广播（" + r + "）——", "event");
    switch (r) {
      case 1:
        S.crash = true;
        log("市场崩盘：今天结算的投资全部减半。", "bad");
        break;
      case 2:
        addHealth(-10);
        log("旧伤发作：-10 健康。", "bad");
        break;
      case 3:
        if (S.debt > 3000) {
          var pay = Math.round(S.debt * 0.1);
          if (S.cash >= pay) { spend(pay); S.debt -= pay; log("催收：立即偿还 " + pay + "。", "bad"); }
          else { S.credit = clamp(S.credit - 20, 0, 100); addEntropy(1); log("催收：无力偿还，信用 -20，熵 +1。", "bad"); }
        } else { log("催收员路过，看了一眼你的账本，走了。", "sys"); }
        break;
      case 4:
        gain(600, { raw: true });
        log("一笔没人认领的尾款打到你账上：+600 现金。", "good");
        break;
      case 5:
        addMemory(8);
        log("你梦见了签约之前的下午：+8 记忆。", "good");
        break;
      case 6: {
        var pool6 = S.fragments.filter(function (x) { return x !== "badge"; });
        if (pool6.length) {
          var f6 = pool6[Math.floor(Math.random() * pool6.length)];
          S.fragments.splice(S.fragments.indexOf(f6), 1);
          log("世界短暂地忘了你的一条规则：" + C.fragments[f6].name + " 被抹掉了。", "bad");
          syncBadge();
        } else {
          gain(400, { raw: true });
          log("交易所例行抽查：+400 现金补贴。", "good");
        }
        break;
      }
    }
  }

  function endDay() {
    if (!S || S.over) return;
    if (storyQueue.length) return;
    // 结算隔夜投资
    for (var i = 0; i < S.pending.length; i++) {
      var p = S.pending[i];
      var ret = p.amount * S.market * (1 + CFG.lowRate);
      if (has("compound")) ret *= (1 + CFG.compoundRate);
      if (S.crash) ret *= 0.5;
      ret = Math.round(ret);
      S.cash += ret;
      log("投资结算：返还 " + ret + " 现金" + (S.crash ? "（崩盘减半）" : ""), "good");
    }
    S.pending = [];
    if (S.stats) S.stats.peakNet = Math.max(S.stats.peakNet || 0, netWorth());
    settleContract();
    if (S.day >= CFG.days) { finish("三十日到期"); return; }
    startDay(S.day + 1);
    emit("day");
  }

  function postAction() {
    checkForget();
    if (checkDeath()) { emit("ending"); return; }
    if (S.stats) S.stats.peakNet = Math.max(S.stats.peakNet || 0, netWorth());
    checkAchievements();
    checkCodex();
    checkStory();
    save();
    emit("change");
  }

  /* ---------- 今日委托 ---------- */
  function contractById(id) {
    var list = C.contracts || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function settleContract() {
    if (!S.contract || S.contract.done) return;
    var c = contractById(S.contract.id);
    if (!c) return;
    var ok = false;
    try { ok = !!c.check(S.today || {}, S, api); } catch (e) { ok = false; }
    if (ok) {
      S.contract.done = true;
      applyEffect(c.reward || {});
      log("委托完成：+" + (c.rewardText || ""), "good");
    } else {
      S.contract.failed = true;
      log("委托没完成。交易所把它那条画掉了。", "sys");
    }
  }

  /* ---------- 对外操作 ---------- */
  function doAction(id, input) {
    if (!S || S.over || storyQueue.length || choice) return false;
    var a = ACTION_MAP[id];
    if (!a) return false;
    var why = a.can();
    if (why) { log(why, "bad"); emit("change"); return false; }
    if (S.ap < a.cost) { log("行动点不足", "bad"); emit("change"); return false; }
    var res = a.run(input || {});
    if (res === "abort") { emit("change"); return false; }
    S.ap -= a.cost;
    S.stats.actions++;
    S.stats.dayActs = (S.stats.dayActs || 0) + 1;
    if (S.today) {
      S.today.actions = (S.today.actions || 0) + 1;
      if (id === "work") S.today.work = (S.today.work || 0) + 1;
      else if (id === "rest") S.today.rest = (S.today.rest || 0) + 1;
      else if (id === "black") S.today.black = (S.today.black || 0) + 1;
      else if (id === "challenge") S.today.challenge = (S.today.challenge || 0) + 1;
      else if (id === "social") S.today.social = (S.today.social || 0) + 1;
      else if (id === "study") S.today.study = (S.today.study || 0) + 1;
    }
    postAction();
    return true;
  }

  function useFragment(id, input) {
    if (!S || S.over || storyQueue.length) return false;
    if (!has(id)) return false;
    if (S.usedToday[id]) { log("今天已经用过了", "bad"); return false; }
    S.usedToday[id] = true;

    if (id === "memoryCash") {
      var amt = Math.floor(input && input.amount || 0);
      amt = Math.min(amt - (amt % 10), Math.floor(S.memory / 10) * 10);
      if (amt < 10) { S.usedToday[id] = false; log("至少需要 10 记忆", "bad"); return false; }
      S.memory -= amt;
      S.stats.memPawned = (S.stats.memPawned || 0) + amt;
      eatLog(amt / 10);
      gain(amt / 10 * 1000, { raw: true });
      log("记忆套现：" + amt + " 记忆 → " + (amt / 10 * 1000) + " 现金", "info");
    } else if (id === "influenceCash") {
      var n = Math.min(Math.floor(input && input.amount || 0), S.influence);
      if (n < 1) { S.usedToday[id] = false; log("没有可兑现的影响力", "bad"); return false; }
      S.influence -= n;
      gain(n * 120, { raw: true });
      log("影响力兑现：" + n + " → " + n * 120 + " 现金", "info");
    } else if (id === "debtShift") {
      if (S.debt <= 0) { S.usedToday[id] = false; log("没有债务", "bad"); return false; }
      var shift = Math.round(S.debt * 0.5);
      var memLoss = Math.ceil(shift / 800) * 5;
      S.debt -= shift;
      addMemory(-memLoss);
      eatLog(Math.ceil(memLoss / 5));
      log("债务转移：债务 -" + shift + "，记忆 -" + memLoss, "bad");
    } else return false;

    postAction();
    return true;
  }

  function currentChoice() { return choice; }
  function resolveChoice(id) {
    if (!choice) return false;
    choice = null;
    if (id) grantFragment(id);
    save();
    emit("change");
    return true;
  }

  function currentStory() { return story || (storyQueue.length ? (story = storyQueue.shift()) : null); }
  function resolveStory(index) {
    if (!story) return false;
    var c = story.choices && story.choices[index];
    if (!c) return false;
    if (c.require && !c.require(S)) {
      // 兜底：选中的选项不可用时，自动落到一个可用的；全都不可用就强制最后一个。
      // 任何时候都不允许剧情卡死。
      var alt = null;
      for (var ai = 0; ai < story.choices.length; ai++) {
        var cc = story.choices[ai];
        if (!cc.require || cc.require(S)) { alt = cc; break; }
      }
      c = alt || story.choices[story.choices.length - 1];
    }
    S.seen.push(story.id);
    if (c && c.effect) applyEffect(c.effect);
    if (c && c.log) log(c.log, c.tone || "info");
    var reply = c && c.reply ? c.reply : null;
    story = null;
    S.lastReply = reply;
    if (reply) log(reply, c.tone === "bad" ? "bad" : "story");
    checkDeath();
    if (!S.over) checkStory();
    save();
    emit("story");
    return true;
  }

  function applyEffect(eff) {
    if (!eff) return;
    if (eff.cash > 0) gain(eff.cash);
    else if (eff.cash < 0) spend(-eff.cash);
    if (eff.health) addHealth(eff.health);
    if (eff.memory) addMemory(eff.memory);
    if (eff.credit) S.credit = clamp(S.credit + eff.credit, 0, 100);
    if (eff.influence) S.influence = Math.max(0, S.influence + eff.influence);
    if (eff.ep) S.ep = Math.max(0, S.ep + eff.ep);
    if (eff.entropy) addEntropy(eff.entropy);
    if (eff.debt) S.debt = Math.max(0, S.debt + eff.debt);
    if (eff.intel) S.intel = Math.max(0, S.intel + eff.intel);
    if (eff.flags) for (var k in eff.flags) S.flags[k] = eff.flags[k];
    if (eff.fragment) grantFragment(eff.fragment);
    if (eff.log) log(eff.log, eff.tone || "event");
  }

  /* ---------- 规则共鸣 ---------- */
  function checkResonance() {
    if (!S || !C.resonance) return;
    for (var i = 0; i < C.resonance.length; i++) {
      var r = C.resonance[i];
      if (S.flags["res_" + r.id]) continue;
      if (S.fragments.indexOf(r.a) >= 0 && S.fragments.indexOf(r.b) >= 0) {
        S.flags["res_" + r.id] = true;
        applyEffect(r.eff || {});
        log("规则共鸣【" + r.name + "】：" + r.text, "event");
      }
    }
  }

  /* ---------- 档案室 ---------- */
  function codexUnlocked(k, st) {
    var w = k.when || {};
    if (w.always) return true;
    if (w.day && st.day < w.day) return false;
    if (w.fragment && st.fragments.indexOf(w.fragment) < 0) return false;
    if (w.scene && st.seen.indexOf(w.scene) < 0) return false;
    if (w.flag && !st.flags[w.flag]) return false;
    if (w.debt && st.debt < w.debt) return false;
    if (w.ending && st.endingId !== w.ending) return false;
    return !!(w.day || w.fragment || w.scene || w.flag || w.debt || w.ending);
  }
  function checkCodex() {
    if (!S || !C.codex) return;
    for (var i = 0; i < C.codex.length; i++) {
      var k = C.codex[i];
      if (META.codex[k.id]) continue;
      var ok = false;
      try { ok = codexUnlocked(k, S); } catch (e) { ok = false; }
      if (ok) {
        META.codex[k.id] = Date.now();
        lastCodex = k.title;
        saveMeta();
        log("档案解锁：【" + k.title + "】", "good");
      }
    }
  }

  /* ---------- 成就 ---------- */
  var lastAchv = null;
  var lastCodex = null;
  function checkAchievements() {
    if (!S || !C.achievements) return [];
    var got = [];
    var m = { endings: META.endings, count: endingCount() };
    for (var i = 0; i < C.achievements.length; i++) {
      var a = C.achievements[i];
      if (META.achievements[a.id]) continue;
      var ok = false;
      try { ok = !!a.when(S, m); } catch (err) { ok = false; }
      if (ok) {
        META.achievements[a.id] = Date.now();
        got.push(a);
        lastAchv = a.name;
        log("✦ 成就解锁：" + a.name, "good");
      }
    }
    if (got.length) saveMeta();
    return got;
  }

  /* ---------- 生命周期 ---------- */
  var api = {};

  var lastOrigin = null;
  function pickOrigin(id) {
    var list = C.origins || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return list.length ? list[0] : null;
  }

  function newGame(originId, slot) {
    if (slot) currentSlot = slot;
    var o = pickOrigin(originId || lastOrigin);
    if (!o) o = { id: "std", cash: CFG.startCash, health: CFG.startHealth, memory: CFG.startMemory,
                  credit: CFG.startCredit, taxMul: 1, restMul: 1, pawnMul: 1 };
    lastOrigin = o.id;
    S = {
      version: C.version,
      day: 1, ap: CFG.apBase,
      origin: o.id,
      cash: o.cash, health: o.health, memory: o.memory, credit: o.credit,
      taxMul: o.taxMul || 1, restMul: o.restMul || 1, pawnMul: o.pawnMul || 1,
      news: "", newsMul: 1, lostCount: 0,
      influence: 0, ep: 0, entropy: 0, debt: 0, intel: 0,
      fragments: [], pending: [], market: 1, crash: false,
      flags: {}, seen: [], log: [], over: false, endingId: null, endReason: "",
      usedToday: {}, stats: { actions: 0, investWin: 0, investLose: 0, memPawned: 0, dayActs: 0, peakNet: 0 },
      memories: [], memSold: [], today: { actions: 0, work: 0, rest: 0, spend: 0, earn: 0, black: 0, challenge: 0, social: 0, study: 0 },
      contract: null,
      net: 0, lastTax: 0, lastReply: null
    };
    syncMemories(false);
    choice = null; story = null; storyQueue = [];
    log("你走进交易所。玻璃门在你身后合上，外面那座城市正在忘记自己是什么。", "story");
    if (o.name) log("身份：" + o.name + "。" + (o.desc || ""), "story");
    startDay(1);
    emit("new");
  }

  function loadGame(slot) {
    try {
      var n = slot || currentSlot;
      var d = readSlot(n);
      if (!d) return false;
      S = d;
      currentSlot = n;
      if (!S.stats) S.stats = { actions: 0, investWin: 0, investLose: 0 };
      if (!S.stats.memPawned) S.stats.memPawned = 0;
      if (!S.stats.dayActs) S.stats.dayActs = 0;
      if (!S.stats.peakNet) S.stats.peakNet = 0;
      if (!S.taxMul) S.taxMul = 1;
      if (!S.restMul) S.restMul = 1;
      if (!S.pawnMul) S.pawnMul = 1;
      if (!S.news) S.news = "";
      if (!S.newsMul) S.newsMul = 1;
      if (!S.lostCount) S.lostCount = 0;
      if (!S.today) S.today = { actions: 0, work: 0, rest: 0, spend: 0, earn: 0, black: 0, challenge: 0, social: 0, study: 0 };
      if (!S.memories) S.memories = [];
      if (!S.memSold) S.memSold = [];
      syncMemories(false);
      checkResonance();
      if (S.origin) lastOrigin = S.origin;
      choice = null; story = null; storyQueue = [];
      if (!S.over) checkStory();
      emit("load");
      return true;
    } catch (e) { return false; }
  }

  api = {
    version: C.version,
    newGame: newGame,
    loadGame: loadGame,
    hasSave: hasSave,
    clearSave: clearSave,
    save: save,
    state: function () { return S; },
    actions: function () {
      return ACTIONS.map(function (a) {
        var why = null;
        if (S.over) why = "本局已结束";
        else if (storyQueue.length || story) why = "先读完这段";
        else if (choice) why = "先做一个选择";
        else if (S.ap < a.cost) why = "行动点不足";
        else why = a.can();
        var d = a.desc;
        if (a.id === "pawn" && S.pawnMul && S.pawnMul !== 1) {
          d = "每 10 记忆换 " + Math.round(800 * S.pawnMul) + " 现金 · 熵 +1";
        }
        return { id: a.id, name: a.name, cost: a.cost, desc: d, tag: a.tag,
                 amount: !!a.amount, choice: !!a.choice, disabled: !!why, reason: why };
      });
    },
    doAction: doAction,
    useFragment: useFragment,
    endDay: endDay,
    currentChoice: currentChoice,
    resolveChoice: resolveChoice,
    currentStory: currentStory,
    resolveStory: resolveStory,
    subscribe: function (fn) { subs.push(fn); return function () { subs = subs.filter(function (f) { return f !== fn; }); }; },
    actionBook: function () {
      return ACTIONS.map(function (a) {
        return { id: a.id, name: a.name, cost: a.cost, desc: a.desc, tag: a.tag, amount: !!a.amount, choice: !!a.choice };
      });
    },
    fragmentBook: function () { return C.fragments; },
    netWorth: netWorth,
    taxFor: function (d) { return S ? taxFor(d) : 0; },
    apMax: apMax,
    fragmentDrain: fragmentDrain,
    canPersist: function () { return persistent; },
    canEndDay: function () { return S && !S.over && !storyQueue.length && !story && !choice; },
    ending: function () {
      if (!S || !S.endingId) return null;
      for (var i = 0; i < C.endings.length; i++) if (C.endings[i].id === S.endingId) return C.endings[i];
      return null;
    },
    origins: function () { return C.origins || []; },
    slots: slots,
    discard: discard,
    saveFailed: function () { return saveErr; },
    slotCount: function () { return SLOT_COUNT; },
    currentSlot: function () { return currentSlot; },
    meta: function () { return META; },
    endingsSeen: endingCount,
    endingsTotal: function () { return C.endings.length; },
    achievementBook: function () {
      return (C.achievements || []).map(function (a) {
        return { id: a.id, name: a.name, desc: a.desc, got: !!META.achievements[a.id] };
      });
    },
    takeAchievement: function () { var x = lastAchv; lastAchv = null; return x; },
    contractStatus: function () {
      if (!S || !S.contract) return null;
      var c = contractById(S.contract.id);
      if (!c) return null;
      var ok = false;
      try { ok = !!c.check(S.today || {}, S, api); } catch (e) {}
      return { text: S.contract.text, hint: S.contract.hint, rewardText: c.rewardText,
               done: ok, settled: !!S.contract.done, failed: !!S.contract.failed };
    },
    takeCodex: function () { var x = lastCodex; lastCodex = null; return x; },
    codexBook: function () {
      return (C.codex || []).map(function (k) {
        return { id: k.id, title: k.title, body: k.body, got: !!META.codex[k.id] };
      });
    },
    codexSeen: function () {
      var n = 0; for (var k in META.codex) if (META.codex[k]) n++; return n;
    },
    memories: function () {
      return (S && S.memories ? S.memories : []).map(function (id) { return { id: id, t: memText(id) }; });
    },
    report: function () {
      if (!S) return null;
      return {
        ep: (C.epitaphs || {})[S.endingId] || "",
        net: S.net,
        peak: (S.stats && S.stats.peakNet) || S.net || 0,
        lost: S.lostCount || 0,
        pawned: (S.stats && S.stats.memPawned) || 0,
        acts: (S.stats && S.stats.actions) || 0,
        seen: endingCount(),
        total: C.endings.length,
        id: S.endingId,
        epilogue: S.epilogue || [],
        lastMemory: S.lastMemory ? memText(S.lastMemory) : ""
      };
    }
  };

  root.ENGINE = api;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* 逆熵协议 · ui.js —— 界面与交互 */
(function () {
  "use strict";
  var C = window.CONTENT, E = window.ENGINE;
  var $ = function (id) { return document.getElementById(id); };
  var SCREENS = ["title", "rules", "about", "gallery", "codex", "game", "ending"];
  var reportText = "";
  var pendingSlot = 1;
  var slotMode = "new";
  var modalState = { type: null, key: null };
  var returnTo = "title";

  function inGame() {
    var S = E.state();
    return !!(S && !S.over);
  }
  function openRules(fromGame) {
    returnTo = fromGame ? "game" : "title";
    buildRules();
    var start = $("btn-rules-start");
    if (start) start.style.display = fromGame ? "none" : "flex";
    var close = $("btn-rules-close");
    if (close) close.textContent = fromGame ? "返回交易所" : "先不签";
    showScreen("rules");
  }
  function openAbout(fromGame) {
    returnTo = fromGame ? "game" : "title";
    buildAbout();
    showScreen("about");
  }
  function goBack() {
    if (returnTo === "game" && inGame()) { showScreen("game"); sync(); }
    else showScreen("title");
  }

  function syncTitle() {
    var bc = $("btn-continue");
    if (!bc) return;
    var any = E.hasSave();
    bc.disabled = !any;
    bc.textContent = any ? "读取存档" : "读取存档（暂无）";
  }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function showScreen(name) {
    SCREENS.forEach(function (s) {
      var n = $("screen-" + s);
      if (n) n.classList.toggle("hidden", s !== name);
    });
    window.scrollTo(0, 0);
  }

  /* ================= 静态内容 ================= */
  function buildRules() {
    var body = "";
    C.rules.forEach(function (r) {
      body += '<div class="rule-block"><h3>' + esc(r.h) + "</h3>";
      (r.p || []).forEach(function (p) { body += "<p>" + p + "</p>"; });
      body += "</div>";
    });
    $("rules-body").innerHTML = body;
    var a = "";
    E.actionBook().forEach(function (x) {
      a += '<div class="rule-line"><span class="rn">' + esc(x.name) + '</span><span class="rd">' + esc(x.desc) +
        '</span><span class="rc">' + (x.cost ? x.cost + " AP" : "0 AP") + "</span></div>";
    });
    $("rules-actions").innerHTML = a;
  }

  function buildAbout() {
    var h = "";
    h += '<div class="rule-block"><h3>版本</h3><p>v' + esc(C.version) + "（" + esc(C.release) + "）</p>";
    h += "<p>离线游戏：不登录、不收集任何数据，存档只保存在这台设备里。" +
      "安卓版仅用联网权限检查更新（断网照常玩）。</p></div>";
    h += '<div class="rule-block"><h3>更新记录</h3>';
    (C.changelog || []).forEach(function (c) {
      h += "<p><strong>v" + esc(c.v) + "</strong> · " + esc(c.date) + "<br>" + c.notes.join("<br>") + "</p>";
    });
    h += "</div>";
    h += '<div class="rule-block"><h3>玩法</h3><p>三十天，每天 3 点行动点。做选择，别把自己弄丢。</p></div>';
    $("about-body").innerHTML = h;
  }

  /* ================= 游戏界面 ================= */
  function renderGame(S) {
    $("hud-day").textContent = S.day;
    var ap = "";
    for (var i = 0; i < Math.max(S.ap, 0); i++) ap += '<span class="ap-pip on"></span>';
    for (var j = 0; j < Math.max(0, E.apMax() - S.ap); j++) ap += '<span class="ap-pip"></span>';
    $("hud-ap").innerHTML = ap;
    $("hud-ap-num").textContent = S.ap;

    renderStats(S);
    renderNews(S);
    renderContract(S);
    renderFrags(S);
    renderMemoryBar(S);
    renderActions(S);
    renderLog(S);

    $("actions-hint").textContent = "明日熵税 ≈ " + E.taxFor(S.day + 1);
    var ph = $("persist-hint");
    if (ph) {
      var bad = !E.canPersist() || !!E.saveFailed();
      ph.classList.toggle("hidden", !bad);
      if (bad) {
        ph.textContent = !E.canPersist()
          ? "⚠ 当前页面不能存档，关掉就没了"
          : "⚠ 存档写入失败（存储空间可能已满），这一局可能保存不下来";
      }
    }
    $("btn-endday").disabled = !E.canEndDay();
    $("btn-endday").textContent = S.day >= C.config.days ? "结算这一天 →" : "结束这一天 →";
  }

  function renderStats(S) {
    var items = [
      ["现金", Math.round(S.cash), ""],
      ["健康", S.health, S.health < 30 ? "warn" : ""],
      ["记忆", S.memory, S.memory < 30 ? "warn" : ""],
      ["信用", S.credit, ""],
      ["影响力", S.influence, ""],
      ["逆熵点", S.ep, ""],
      ["熵值", S.entropy, S.entropy >= 7 ? "ent" : ""],
      ["债务", Math.round(S.debt), S.debt > 0 ? "warn" : ""],
      ["情报", S.intel, ""],
      ["市场", "×" + S.market.toFixed(2), ""]
    ];
    var html = "";
    items.forEach(function (it) {
      html += '<div class="stat ' + it[2] + '"><div class="k">' + it[0] + '</div><div class="v">' + it[1] + "</div></div>";
    });
    $("stats").innerHTML = html;
  }

  function renderNews(S) {
    var nb = $("newsbar");
    if (!nb) return;
    var on = !!(S.news);
    nb.classList.toggle("hidden", !on);
    if (!on) { nb.textContent = ""; return; }
    $("news-text").textContent = S.news;
    $("news-mul").textContent = (S.newsMul && S.newsMul !== 1) ? "工价 ×" + S.newsMul.toFixed(2) : "工价 ×1.00";
  }

  function renderContract(S) {
    var el = $("contract");
    if (!el) return;
    var c = S.contract;
    if (!c || c.done || c.failed) { el.classList.add("hidden"); el.textContent = ""; return; }
    el.classList.remove("hidden");
    var st = E.contractStatus();
    var tail = st && st.done ? "　✓ 已完成，结束这一天时发放" : "";
    var reward = st && st.rewardText ? "　→ +" + st.rewardText : "";
    el.textContent = "【今日委托】" + c.text + "（" + c.hint + "）" + reward + tail;
  }

  function renderMemoryBar(S) {
    var mb = $("membar");
    if (!mb) return;
    var n = (S.memories || []).length;
    mb.textContent = n ? "你还记得 " + n + " 件事 ▸" : "";
    mb.classList.toggle("hidden", n === 0);
  }

  function renderFrags(S) {
    if (!S.fragments.length) {
      $("frags").innerHTML = '<span class="frag-empty">尚无规则碎片 · 第 3 枚起每天会啃食记忆</span>';
      return;
    }
    $("frags").innerHTML = S.fragments.map(function (id) {
      var f = C.fragments[id];
      if (!f) return "";
      return '<span class="frag' + (id === "badge" ? " badge" : "") + '" data-frag="' + id + '">' + esc(f.name) + "</span>";
    }).join("");
  }

  function renderActions(S) {
    var list = E.actions();
    var html = "";
    list.forEach(function (a) {
      var cost = a.cost ? '<span class="cost">' + a.cost + " AP</span>" : '<span class="cost">0 AP</span>';
      html += '<button class="action" data-act="' + a.id + '"' + (a.disabled ? " disabled" : "") + ">" +
        '<span class="an">' + esc(a.name) + cost + "</span>" +
        '<span class="ad">' + esc(a.desc) + "</span>" +
        (a.disabled && a.reason ? '<span class="ar">' + esc(a.reason) + "</span>" : "") +
        "</button>";
    });
    // 碎片技能
    if (S.fragments.indexOf("memoryCash") >= 0) {
      html += '<button class="action special" data-fragact="memoryCash"' + (S.usedToday.memoryCash ? " disabled" : "") + '>' +
        '<span class="an">记忆套现<span class="cost">0 AP</span></span><span class="ad">10 记忆 → 1000 现金（每天一次）</span></button>';
    }
    if (S.fragments.indexOf("influenceCash") >= 0) {
      html += '<button class="action special" data-fragact="influenceCash"' + (S.usedToday.influenceCash ? " disabled" : "") + '>' +
        '<span class="an">影响力兑现<span class="cost">0 AP</span></span><span class="ad">1 影响力 → 120 现金（每天一次）</span></button>';
    }
    if (S.fragments.indexOf("debtShift") >= 0) {
      html += '<button class="action special" data-fragact="debtShift"' + (S.usedToday.debtShift ? " disabled" : "") + '>' +
        '<span class="an">债务转移<span class="cost">0 AP</span></span><span class="ad">50% 债务 → 记忆损失（每天一次）</span></button>';
    }
    $("actions").innerHTML = html;
  }

  function renderLog(S) {
    var box = $("log");
    var items = S.log.slice(-80);
    box.innerHTML = items.map(function (l) {
      return '<div class="' + (l.c || "info") + '">' + esc(l.m) + "</div>";
    }).join("");
    box.scrollTop = box.scrollHeight;
  }

  /* ================= 弹层 ================= */
  function closeModal() {
    var root = $("modal-root");
    root.classList.add("hidden");
    root.innerHTML = "";
    modalState = { type: null, key: null };
  }
  function openModal(html) {
    var root = $("modal-root");
    root.innerHTML = '<div class="modal">' + html + "</div>";
    root.classList.remove("hidden");
  }

  function openStoryScene(sc) {
    var html = '<div class="modal-kicker">' + esc(sc.title) + "</div>";
    (sc.lines || []).forEach(function (line) {
      var isQuote = line.charAt(0) === "「";
      html += '<p class="' + (isQuote ? "q" : "") + '">' + esc(line) + "</p>";
    });
    html += '<div class="choices">';
    (sc.choices || []).forEach(function (c, i) {
      var blocked = c.require && !c.require(E.state());
      html += '<button class="choice" data-choice="' + i + '"' + (blocked ? " disabled" : "") + ">" +
        esc(c.text) + (blocked ? '<span class="req">' + esc(c.reqText || "条件不足") + "</span>" : "") +
        "</button>";
    });
    html += "</div>";
    openModal(html);
    modalState = { type: "story", key: sc.id };
  }

  function openFragmentChoice(ch) {
    var html = '<div class="modal-kicker">规则碎片</div><h2>' + esc(ch.title) + "</h2>" +
      '<p>碎片会跟着你走。它会改写规则，也会慢慢啃掉你的记忆。</p><div class="choices">';
    ch.options.forEach(function (id) {
      var f = C.fragments[id] || { name: id, desc: "" };
      html += '<button class="choice" data-frag="' + id + '"><strong>' + esc(f.name) + "</strong><span class=\"req\" style=\"color:#7d8fa3\">" + esc(f.desc) + "</span></button>";
    });
    html += "</div>";
    openModal(html);
    modalState = { type: "choice", key: ch.source };
  }

  function openAmount(cfg) {
    var html = '<div class="modal-kicker">' + esc(cfg.kicker || "交易") + "</div><h2>" + esc(cfg.title) + "</h2>";
    if (cfg.hint) html += "<p>" + esc(cfg.hint) + "</p>";
    html += '<input class="amount-input" id="amount-input" type="number" inputmode="numeric" value="' +
      cfg.initial + '" min="' + cfg.step + '" max="' + cfg.max + '" step="' + cfg.step + '">';
    html += '<div class="amount-box">';
    [0.25, 0.5, 1].forEach(function (p) {
      var v = Math.max(cfg.step, Math.floor(cfg.max * p / cfg.step) * cfg.step);
      if (v > cfg.max) v = cfg.max;
      html += '<button class="chip" data-amt="' + v + '">' + (p === 1 ? "全部 " : Math.round(p * 100) + "% ") + v + "</button>";
    });
    html += "</div>";
    html += '<div class="row"><button class="btn btn-ghost" id="amount-cancel">取消</button>' +
      '<button class="btn btn-primary" id="amount-ok">确认</button></div>';
    openModal(html);
    modalState = { type: "amount", key: cfg.key };
    var input = $("amount-input");
    input.addEventListener("input", function () {
      input.value = input.value.replace(/[^\d]/g, "").slice(0, 7);
    });
    input.focus();
    $("amount-cancel").onclick = closeModal;
    $("amount-ok").onclick = function () {
      var v = Math.floor(Number(input.value || 0));
      if (!(v >= cfg.step)) { input.value = cfg.initial; return; }
      v = Math.min(v, cfg.max);
      closeModal();
      cfg.onOk(v);
    };
  }

  function openMemoryPawn() {
    var S = E.state();
    var list = E.memories();
    if (!S) return;
    if (!list.length) { toast("你已经没有能想起来的事了"); return; }
    var pay = Math.round(800 * (S.pawnMul || 1));
    var html = '<div class="modal-kicker">典当</div><h2>你要卖掉哪一段？</h2>' +
      "<p>每段记忆值 10 点，换 " + pay + " 现金，熵 +1。卖掉之后，你再也想不起来它。</p><div class=\"choices\">";
    list.forEach(function (m) {
      html += '<button class="choice" data-pawn-mem="' + m.id + '"><span class="memt">' + esc(m.t) + "</span>" +
        '<span class="perk">+' + pay + " 现金 · 熵 +1</span></button>";
    });
    html += "</div>";
    openModal(html);
    modalState = { type: "memory", key: "pawn" };
  }

  function openMemoryList() {
    var list = E.memories();
    var html = '<div class="modal-kicker">记忆</div><h2>你还记得 ' + list.length + " 件事</h2>" +
      "<p>每段 10 点。记忆归零，就是遗忘。</p><div class=\"memlist\">";
    list.forEach(function (m) { html += '<div class="memrow">' + esc(m.t) + "</div>"; });
    html += "</div>";
    openModal(html);
    modalState = { type: "memlist", key: "mem" };
  }

  function openBlack() {
    var html = '<div class="modal-kicker">黑市</div><h2>用 10 点健康换什么？</h2>' +
      '<p>不管换哪样，熵都会 +1。健康不是钱，但在这里它很接近钱。</p><div class="choices">' +
      '<button class="choice" data-black="ep">换 1 点逆熵点</button>' +
      '<button class="choice" data-black="cash">换 500 现金</button>' +
      "</div>";
    openModal(html);
    modalState = { type: "black", key: "black" };
  }

  function openMenu() {
    var html = '<div class="modal-kicker">选项</div><h2>交易所</h2><div class="choices">' +
      '<button class="choice" data-menu="rules">协议条款</button>' +
      '<button class="choice" data-menu="about">关于 / 版本 v' + esc(C.version) + "</button>" +
      '<button class="choice" data-menu="title">回到门厅（保留存档）</button>' +
      '<button class="choice" data-menu="restart">撕毁这一份，重新开始</button>' +
      "</div>";
    openModal(html);
    modalState = { type: "menu", key: "menu" };
  }

  function openFragmentInfo(id) {
    var f = C.fragments[id];
    if (!f) return;
    openModal('<div class="modal-kicker">规则碎片</div><h2>' + esc(f.name) + "</h2><p>" + esc(f.desc) + "</p>" +
      (f.story ? '<p class="frag-story">' + esc(f.story) + "</p>" : "") +
      '<div class="row"><button class="btn btn-ghost" id="frag-close">知道了</button></div>');
    modalState = { type: "fraginfo", key: id };
    $("frag-close").onclick = closeModal;
  }

  /* ================= 提示条 ================= */
  var toastTimer = null;
  function toast(msg) {
    var t = $("toast");
    if (!t) return;
    t.textContent = msg;
    t.classList.remove("hidden");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.add("hidden"); }, 2600);
  }
  function copyText(text, okMsg) {
    if (!text) return;
    var fallback = function () { window.prompt("复制下面这段：", text); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, fallback);
    } else fallback();
  }

  /* ================= 图鉴 ================= */
  function openGallery() {
    buildGallery();
    showScreen("gallery");
  }
  function buildGallery() {
    var seen = E.meta().endings || {};
    var n = 0;
    var cards = "";
    (C.endings || []).forEach(function (e) {
      var got = !!seen[e.id];
      if (got) n++;
      var body = got ? ((e.text && e.text[0]) || "") : ("谜语：" + (e.clue || "尚未收集"));
      cards += '<div class="g-card' + (got ? " got" : "") + '">' +
        '<div class="g-title">' + (got ? esc(e.title) : "？？？") + "</div>" +
        '<div class="g-body">' + esc(body) + "</div>" +
        "</div>";
    });
    $("gallery-summary").textContent = "已收集 " + n + " / " + (C.endings || []).length +
      " 个结局 · 共完成 " + (E.meta().runs || 0) + " 次契约";
    $("gallery-endings").innerHTML = cards;

    var ach = E.achievementBook();
    var gotA = ach.filter(function (a) { return a.got; }).length;
    var ah = '<p class="g-count">成就 ' + gotA + " / " + ach.length + "</p>";
    ach.forEach(function (a) {
      ah += '<div class="g-line' + (a.got ? " got" : "") + '"><span class="gn">' +
        (a.got ? "✦ " : "· ") + esc(a.name) + '</span><span class="gd">' + esc(a.desc) + "</span></div>";
    });
    $("gallery-achievements").innerHTML = ah;
  }

  /* ================= 存档槽 ================= */
  function openSlotPicker(mode) {
    slotMode = mode || "new";
    var list = E.slots();
    var html = '<div class="modal-kicker">存档</div><h2>' +
      (slotMode === "load" ? "读取哪一份契约" : "三份契约") + "</h2><p>" +
      (slotMode === "load" ? "每份契约各自独立，互不覆盖。" : "选一个槽签新的一份；槽里已有的会被覆盖。") +
      '</p><div class="slots">';
    list.forEach(function (s) {
      var desc = s.empty ? "空" :
        "第 " + s.day + " 天 · " + (s.originName || "标准开局") +
        (s.over ? " · 已结算【" + (s.endingTitle || s.endingId) + "】" : "");
      html += '<div class="slot-row"><div class="slot-info"><div class="slot-name">槽 ' + s.id +
        '</div><div class="slot-desc">' + esc(desc) + '</div></div><div class="slot-acts">';
      if (!s.empty) html += '<button class="slot-btn" data-slot-load="' + s.id + '">继续</button>';
      if (slotMode === "new") {
        html += '<button class="slot-btn primary" data-slot-new="' + s.id + '">' +
          (s.empty ? "在这里签" : "覆盖") + "</button>";
      }
      if (!s.empty) html += '<button class="slot-btn danger" data-slot-del="' + s.id + '">删</button>';
      html += "</div></div>";
    });
    html += "</div>";
    openModal(html);
    modalState = { type: "slot", key: slotMode };
  }

  /* ================= 档案室 ================= */
  function openCodex() {
    buildCodex();
    showScreen("codex");
  }
  function buildCodex() {
    var list = E.codexBook();
    var got = list.filter(function (k) { return k.got; }).length;
    $("codex-summary").textContent = "已解密 " + got + " / " + list.length + " 条 · 继续活，或者继续欠着";
    var html = "";
    list.forEach(function (k) {
      html += '<div class="codex-item' + (k.got ? " got" : "") + '">' +
        '<div class="codex-t">' + (k.got ? esc(k.title) : "未解密") + "</div>" +
        '<div class="codex-b">' + (k.got
          ? k.body.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("")
          : "<p>这一条还没发生到你身上。</p>") + "</div></div>";
    });
    $("codex-list").innerHTML = html;
  }

  /* ================= 开局身份 ================= */
  function openOriginPicker() {
    var html = '<div class="modal-kicker">签字之前</div><h2>你是谁？</h2>' +
      '<p>三个身份，三种开局。之后的路一样不好走。</p><div class="choices">';
    E.origins().forEach(function (o) {
      html += '<button class="choice origin" data-origin="' + o.id + '"><strong>' + esc(o.name) + "</strong>" +
        '<span class="req" style="color:#7d8fa3">' + esc(o.desc) + "</span>" +
        '<span class="perk">' + (o.perks || []).map(function (p) { return esc(p); }).join(" · ") + "</span></button>";
    });
    html += "</div>";
    openModal(html);
    modalState = { type: "origin", key: "origin" };
  }

  /* ================= 结局 ================= */
  function renderEnding() {
    var S = E.state();
    var e = E.ending();
    if (!S || !e) return;
    closeModal();
    $("ending-title").textContent = e.title;
    $("ending-text").innerHTML = (e.text || []).map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("");
    var stats = [
      ["净资产", S.net], ["天数", S.day + " / " + C.config.days], ["健康", S.health],
      ["记忆", S.memory], ["熵值", S.entropy], ["债务", Math.round(S.debt)],
      ["现金", Math.round(S.cash)], ["影响力", S.influence], ["碎片", S.fragments.length]
    ];
    $("ending-stats").innerHTML = stats.map(function (it) {
      return '<div class="stat"><div class="k">' + it[0] + '</div><div class="v">' + it[1] + "</div></div>";
    }).join("");

    var rep = E.report();
    if (rep) {
      var lines = [
        ["结局收集", rep.seen + " / " + rep.total],
        ["墓志铭", rep.ep || "——"],
        ["最后记得的", rep.lastMemory || "——"],
        ["最高净资产", rep.peak],
        ["行动次数", rep.acts],
        ["典当记忆", rep.pawned + " 点" + (rep.lost ? "，抹掉了 " + rep.lost + " 段回忆" : "")]
      ];
      var epiHTML = (rep.epilogue || []).map(function (t) {
        return '<p class="epi">' + esc(t) + "</p>";
      }).join("");
      $("life-report").innerHTML = epiHTML + '<h3 class="section-h">人生报告</h3>' + lines.map(function (it) {
        return '<div class="rep-line"><span class="rk">' + esc(it[0]) + '</span><span class="rv">' + esc(it[1]) + "</span></div>";
      }).join("");
      reportText = "《逆熵协议》· 结局【" + e.title + "】(" + rep.seen + "/" + rep.total + ")\n" +
        ((rep.epilogue || []).join("\n") + ((rep.epilogue || []).length ? "\n" : "")) +
        "净资产 " + S.net + " · 最高 " + rep.peak + " · 行动 " + rep.acts + " 次\n" +
        (rep.ep || "") + (rep.lastMemory ? "\n最后记得的：" + rep.lastMemory : "");
    }
    var cb = $("btn-copy-report");
    if (cb) cb.onclick = function () { copyText(reportText, "战绩已复制"); };
    showScreen("ending");
  }

  /* ================= 同步 ================= */
  function sync() {
    var achv = E.takeAchievement();
    if (achv) toast("✦ 成就解锁：" + achv);
    var ckx = E.takeCodex();
    if (ckx) toast("📁 档案解锁：" + ckx);
    var S = E.state();
    if (!S) { showScreen("title"); return; }
    if (S.over) { renderEnding(); return; }
    showScreen("game");
    renderGame(S);
    var sc = E.currentStory();
    if (sc) {
      if (modalState.type !== "story" || modalState.key !== sc.id) openStoryScene(sc);
      return;
    }
    var ch = E.currentChoice();
    if (ch && modalState.type !== "choice") openFragmentChoice(ch);
  }

  /* ================= 事件 ================= */
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest ? ev.target.closest("button, .frag") : null;
    if (!t) return;

    // 典当：选中某一段记忆
    if (t.dataset && t.dataset.pawnMem) {
      closeModal();
      E.doAction("pawn", { memoryId: t.dataset.pawnMem });
      sync();
      return;
    }
    // 记忆清单
    if (t.id === "membar") { openMemoryList(); return; }
    // 存档槽：开新的一份
    if (t.dataset && t.dataset.slotNew) {
      var sn = Number(t.dataset.slotNew);
      var info = E.slots()[sn - 1];
      if (info && !info.empty &&
          !window.confirm("槽 " + sn + " 里有一份未完成的契约（第 " + info.day + " 天），覆盖它？")) return;
      pendingSlot = sn;
      openOriginPicker();
      return;
    }
    // 存档槽：继续
    if (t.dataset && t.dataset.slotLoad) {
      closeModal();
      if (E.loadGame(Number(t.dataset.slotLoad))) sync();
      else toast("存档读取失败");
      return;
    }
    // 存档槽：删除
    if (t.dataset && t.dataset.slotDel) {
      var delN = Number(t.dataset.slotDel);
      if (window.confirm("删除槽 " + delN + " 的契约？删了就找不回来了。")) {
        E.clearSave(delN);
        openSlotPicker(slotMode);
      }
      return;
    }
    // 开局身份
    if (t.dataset && t.dataset.origin) {
      closeModal();
      E.newGame(t.dataset.origin, pendingSlot);
      sync();
      return;
    }
    // 剧情选项
    if (t.dataset && t.dataset.choice !== undefined) {
      var idx = Number(t.dataset.choice);
      closeModal();
      E.resolveStory(idx);
      sync();
      return;
    }
    // 碎片三选一
    if (t.dataset && t.dataset.frag && t.classList.contains("choice")) {
      closeModal();
      E.resolveChoice(t.dataset.frag);
      sync();
      return;
    }
    // 碎片详情
    if (t.classList && t.classList.contains("frag") && t.dataset.frag) {
      openFragmentInfo(t.dataset.frag);
      return;
    }
    // 行动
    if (t.dataset && t.dataset.act) {
      var id = t.dataset.act;
      var S = E.state();
      if (!S) return;
      if (id === "black") { openBlack(); return; }
      if (id === "invLow" || id === "invHigh") {
        var max = id === "invHigh" ? Math.min(Math.floor(S.cash), C.config.highCap) : Math.floor(S.cash);
        if (max < 100) { return; }
        openAmount({
          kicker: "投资", title: id === "invHigh" ? "押多少？" : "投多少？",
          hint: id === "invHigh"
            ? "掷出 1-3 全损，4-5 返 1.8 倍，6 返 3.2 倍。上限 " + C.config.highCap + "。"
            : "次日按「市场 × 1.03」返还。市场均值 1.00。",
          max: max, step: 100, initial: Math.min(max, Math.max(100, Math.floor(max / 2))),
          key: id,
          onOk: function (v) { E.doAction(id, { amount: v }); sync(); }
        });
        return;
      }
      if (id === "pawn") { openMemoryPawn(); return; }
      E.doAction(id, {});
      sync();
      return;
    }
    // 碎片技能
    if (t.dataset && t.dataset.fragact) {
      var fid = t.dataset.fragact;
      var St = E.state();
      if (fid === "memoryCash") {
        var mx = Math.floor(St.memory / 10) * 10;
        openAmount({ kicker: "碎片技能", title: "套现多少记忆？", hint: "10 记忆 → 1000 现金。每天一次。",
          max: mx, step: 10, initial: Math.min(mx, 10), key: "memoryCash",
          onOk: function (v) { E.useFragment("memoryCash", { amount: v }); sync(); } });
        return;
      }
      if (fid === "influenceCash") {
        openAmount({ kicker: "碎片技能", title: "兑现多少影响力？", hint: "1 影响力 → 120 现金。每天一次。",
          max: St.influence, step: 1, initial: Math.min(St.influence, 1), key: "influenceCash",
          onOk: function (v) { E.useFragment("influenceCash", { amount: v }); sync(); } });
        return;
      }
      E.useFragment(fid, {});
      sync();
      return;
    }
    // 黑市
    if (t.dataset && t.dataset.black) {
      closeModal();
      E.doAction("black", { blackCash: t.dataset.black === "cash" });
      sync();
      return;
    }
    // 菜单
    if (t.dataset && t.dataset.menu) {
      var m = t.dataset.menu;
      closeModal();
      if (m === "rules") { openRules(true); }
      else if (m === "about") { openAbout(true); }
      else if (m === "title") { returnTo = "title"; syncTitle(); showScreen("title"); }
      else if (m === "restart") {
        if (window.confirm("撕毁当前契约，从第一天重新开始？这个槽会被清空。")) {
          pendingSlot = E.currentSlot();
          E.clearSave(pendingSlot);
          openOriginPicker();
        }
      }
      return;
    }
    // 金额快捷
    if (t.dataset && t.dataset.amt) {
      var inp = $("amount-input");
      if (inp) inp.value = t.dataset.amt;
      return;
    }
  });

  /* ================= 启动 ================= */
  function boot() {
    buildRules();
    buildAbout();
    $("tagline").textContent = C.tagline;
    $("title-version").textContent = "v" + C.version;
    var tw = $("title-warn");
    if (tw) tw.classList.toggle("hidden", !!E.canPersist());

    var btnContinue = $("btn-continue");
    syncTitle();

    $("btn-new").onclick = function () { openSlotPicker("new"); };
    btnContinue.onclick = function () { openSlotPicker("load"); };
    $("btn-rules").onclick = function () { openRules(false); };
    $("btn-about").onclick = function () { openAbout(false); };
    $("btn-rules-back").onclick = goBack;
    $("btn-rules-close").onclick = goBack;
    $("btn-rules-start").onclick = function () { openSlotPicker("new"); };
    $("btn-about-back").onclick = goBack;
    $("btn-clear-save").onclick = function () {
      if (window.confirm("清除全部三个存档槽？图鉴和成就保留，但进行中的局会丢。")) {
        E.clearSave();
        E.discard();
        syncTitle();
        showScreen("title");
        toast("存档已全部清除");
      }
    };
    $("btn-gallery").onclick = openGallery;
    $("btn-gallery-back").onclick = function () { showScreen("title"); };
    $("btn-codex").onclick = openCodex;
    $("btn-codex-back").onclick = function () { showScreen("title"); };
    $("btn-menu").onclick = openMenu;
    $("btn-endday").onclick = function () { E.endDay(); sync(); };
    $("btn-again").onclick = function () { pendingSlot = E.currentSlot(); openOriginPicker(); };
    $("btn-to-title").onclick = function () { syncTitle(); showScreen("title"); };
    $("modal-root").onclick = function (ev) {
      if (ev.target === $("modal-root") && modalState.type !== "story" && modalState.type !== "choice") closeModal();
    };

    E.subscribe(function () {
      var S = E.state();
      if (!S) return;
      if (S.over) { renderEnding(); return; }
      if ($("screen-game").classList.contains("hidden")) {
        // 从标题/规则进入游戏
        showScreen("game");
      }
      sync();
    });

    showScreen("title");
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

  window.UI = { sync: sync };
})();

</script>
</body>
</html>
